# Tech Atlas production stack -- application services.
#
# This is one Compose project split over three files, joined by COMPOSE_FILE in .env:
#   docker-compose.yml   the application (this file)
#   compose.traefik.yml  reverse proxy, terminates HTTPS for Cloudflare
#   compose.auth.yml     authentik identity provider for the admin UI
# Run every `docker compose ...` command from this directory so .env is picked up.
#
# Third-party images are pinned to exact versions; bump them deliberately. The app images
# follow ${VERSION}, by default the moving ":stable" tag that create_release.py sets.

x-traefik-labels: &traefik-labels
  traefik.enable: "true"

x-frontend: &frontend-defaults
  restart: unless-stopped
  mem_limit: 1g
  networks:
    - edge

x-backend: &backend-defaults
  restart: unless-stopped
  networks:
    - edge
    - backend

x-common-env: &common-env
  MONGO_URL: mongodb:27017

x-oauth-env: &oauth-env
  # Defaults point at the bundled authentik (compose.auth.yml). Set OAUTH_ISSUER / OAUTH_JWKS
  # in .env to use a different identity provider. The JWKS URL is OAUTH_ISSUER + OAUTH_JWKS.
  OAUTH_ISSUER: ${OAUTH_ISSUER:-https://${AUTH_HOST}/application/o/tech-atlas/}
  OAUTH_AUDIENCE: ${OAUTH_CLIENT_ID}
  OAUTH_JWKS: ${OAUTH_JWKS:-jwks/}

x-pipe-env: &pipe-env
  DB_PIPE_NAME: ${DB_PIPE_DATABASE}
  DB_PIPE_USER: ${DB_PIPE_USER_RW}
  DB_PIPE_PASS: ${DB_PIPE_PASS_RW}

x-raw-env: &raw-env
  DB_RAW_NAME: ${DB_RAW_DATABASE}
  DB_RAW_USER: ${DB_RAW_RW_USER}
  DB_RAW_PASS: ${DB_RAW_RW_PASS}

x-cache-env: &cache-env
  DB_CACHE_NAME: ${DB_CACHE_DATABASE}
  DB_CACHE_USER: ${DB_CACHE_USER_RW}
  DB_CACHE_PASS: ${DB_CACHE_PASS_RW}

x-registry-env: &registry-env
  DB_REGISTRY_NAME: ${DB_REGISTRY_NAME}
  DB_REGISTRY_USER: ${DB_REGISTRY_USER}
  DB_REGISTRY_PASS: ${DB_REGISTRY_PASS}

x-fe-rw-env: &fe-rw-env
  DB_FE_DATABASE: ${DB_FE_DATABASE}
  DB_FE_RW_USER: ${DB_FE_RW_USER}
  DB_FE_RW_PASS: ${DB_FE_RW_PASS}

x-fe-r-env: &fe-r-env
  DB_NAME: ${DB_FE_DATABASE}
  DB_USER: ${DB_FE_R_USER}
  DB_PASS: ${DB_FE_R_PASS}

x-photon: &photon-env
  PHOTON_URL: http://photon:2322

services:
  mongodb:
    image: mongo:8.0.34
    container_name: tech-atlas-db
    # WiredTiger otherwise sizes its cache from the host (about half of its RAM) and keeps what
    # it has read or written until that fills up. The limit leaves room for connections, index
    # builds and the page cache on top of the 1 GB cache.
    command: ["--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2g
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - db-data:/data/db
      # Both are only read on the very first start, while the data volume is still empty.
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./.env:/.env:ro

  dashboard-ui:
    <<: *frontend-defaults
    image: moosi312/tech-atlas-dashboard-ui:${VERSION}
    container_name: tech-atlas-dashboard-ui
    labels:
      <<: *traefik-labels
      traefik.http.routers.tech-atlas-dashboard-ui.rule: "Host(`${DASHBOARD_HOST}`) && (!PathPrefix(`/api`))"
      traefik.http.routers.tech-atlas-dashboard-ui.entrypoints: websecure

  dashboard-be:
    <<: *backend-defaults
    image: moosi312/tech-atlas-dashboard-be:${VERSION}
    container_name: tech-atlas-dashboard-be
    mem_limit: 1g
    environment:
      <<: [*common-env, *fe-r-env]
    labels:
      <<: *traefik-labels
      traefik.http.routers.tech-atlas-dashboard-be.rule: "Host(`${DASHBOARD_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.tech-atlas-dashboard-be.entrypoints: websecure

  admin-ui:
    <<: *frontend-defaults
    image: moosi312/tech-atlas-admin-ui:${VERSION}
    container_name: tech-atlas-admin-ui
    labels:
      <<: *traefik-labels
      traefik.http.routers.tech-atlas-admin-ui.rule: "Host(`${ADMIN_HOST}`) && (!PathPrefix(`/api`))"
      traefik.http.routers.tech-atlas-admin-ui.entrypoints: websecure

  admin-be:
    <<: *backend-defaults
    image: moosi312/tech-atlas-admin-be:${VERSION}
    container_name: tech-atlas-admin-be
    # A full transform run holds the scraper data and every step result until it ends; this
    # is headroom for that, and a ceiling that turns a leak into a restart instead of host pressure.
    mem_limit: 4g
    environment:
      <<: [*common-env, *pipe-env, *raw-env, *registry-env, *oauth-env, *cache-env, *fe-rw-env, *photon-env]
    labels:
      <<: *traefik-labels
      traefik.http.routers.tech-atlas-admin-be.rule: "Host(`${ADMIN_HOST}`) && PathPrefix(`/api/admin`)"
      traefik.http.routers.tech-atlas-admin-be.entrypoints: websecure

  photon:
    image: rtuszik/photon-docker:2.5.0
    container_name: tech-atlas-photon
    mem_limit: 2g
    restart: unless-stopped
    environment:
      - REGION=at
      - UPDATE_STRATEGY=PARALLEL     # background download, then swap
      - UPDATE_INTERVAL=720h         # ~30 days
      # The heap has to fit inside mem_limit with room for the JVM's own memory on top;
      # a heap as large as the limit would get the container killed instead of collected.
      - JAVA_PARAMS=-Xmx1500m
    volumes:
      - photon-index:/photon/data
    networks:
      - backend

networks:
  # Traefik <-> everything it routes to.
  edge:
    name: tech-atlas-edge
  # Application backends <-> MongoDB and Photon.
  backend:
    name: tech-atlas-backend

volumes:
  db-data:
    name: tech-atlas-db-data
  photon-index:
    name: tech-atlas-photon-index
