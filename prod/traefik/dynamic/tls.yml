# Certificate Traefik presents to Cloudflare for every host.
#
# init.sh creates a self-signed pair so the stack starts out of the box; that works with the
# Cloudflare SSL/TLS mode "Full". For "Full (strict)" replace both files with a Cloudflare
# Origin CA certificate (Cloudflare dashboard > SSL/TLS > Origin Server > Create Certificate)
# covering the hosts in .env, then: docker compose restart traefik
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.crt
        keyFile: /certs/origin.key
  options:
    default:
      minVersion: VersionTLS12
