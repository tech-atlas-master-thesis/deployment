# Certificate Traefik presents to Cloudflare for every host.
#
# origin.crt is a Cloudflare Origin CA certificate and is committed to the repository;
# origin.key is its private key and is copied to the server by hand (never committed).
# See README.md, "Certificate". After replacing either file: docker compose restart traefik
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.crt
        keyFile: /certs/origin.key
  options:
    default:
      minVersion: VersionTLS12
